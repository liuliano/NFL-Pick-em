<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b241a"><title>Week 6 Game Picks | NFL Pick'em</title><style>*{box-sizing:border-box}html{background:#081d16}body{margin:0;background:linear-gradient(#123c2b,#071911 380px);color:#edf8f1;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:18px 18px 40px}.back{display:inline-block;text-decoration:none;color:#e6f6ed;background:#173e2c;border:1px solid #426e58;border-radius:4px;padding:14px;font-weight:850;letter-spacing:.4px;margin-bottom:22px}.hero{border:1px solid #3b7156;border-left:6px solid #54d494;border-radius:5px;background:#133c2c;padding:24px 28px;margin-bottom:18px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:1.6px;color:#9dc4ae}.hero h1{font-size:clamp(28px,6vw,46px);margin:12px 0}.muted{color:#a6bcaf}.balance{border:1px solid #386a51;background:#0c281e;border-radius:5px;padding:20px;margin-bottom:18px}.balance h2{font-size:14px;letter-spacing:1.2px;color:#b0d0bd;margin:0 0 14px}.split{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.track{height:14px;background:#587567;border-radius:8px;overflow:hidden;margin-top:18px}.fill{height:100%;background:#4bd391}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.team{min-width:0}.teamhead{display:flex;justify-content:space-between;gap:5px;align-items:baseline;border-bottom:1px solid #416c55;padding:10px 0;color:#65d99a}.teamhead strong{font-size:22px}.teamhead span{font-size:12px;color:#a6c0b0}.name{padding:12px 0;border-bottom:1px solid #264535;overflow-wrap:anywhere}.pending{padding:22px 0;color:#b2c5b9;line-height:1.5}@media(max-width:390px){.wrap{padding:12px}.hero{padding:20px 16px}.columns{gap:12px}.teamhead{display:block}.teamhead span{display:block;margin-top:4px}.name{font-size:14px}}@supports(-webkit-touch-callout:none){.wrap{padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom))}.back{touch-action:manipulation}.name{-webkit-text-size-adjust:100%}}</style></head><body><main class="wrap"><a class="back" href="./weeks/week-06.html#scoreboardSection">‹ BACK TO WEEK 6 SCOREBOARD</a><section class="hero"><div class="eyebrow" id="weekGame">WEEK 6</div><h1 id="matchup"></h1><div class="muted" id="kickoff"></div></section><section class="balance"><h2 id="balanceTitle">LEAGUE PICK BALANCE</h2><div class="split"><span id="awaySummary"></span><span id="homeSummary"></span></div><div class="track"><div class="fill" id="fill" style="width:0"></div></div></section><section class="columns"><div class="team"><div class="teamhead"><strong id="awayTeam"></strong><span id="awayCount"></span></div><div id="awayNames"></div></div><div class="team"><div class="teamhead"><strong id="homeTeam"></strong><span id="homeCount"></span></div><div id="homeNames"></div></div></section></main><script>
const games=[["SEA","DEN"],["HOU","JAC"],["CHI","ATL"],["BAL","CLE"],["TEN","IND"],["NYJ","NE"],["NO","NYG"],["CAR","PHI"],["PIT","TB"],["ARI","LAR"],["LAC","KC"],["BUF","LV"],["DAL","GB"],["WAS","SF"]];
const times=["Thu Oct 15 · 8:15 PM ET","Sun Oct 18 · 9:30 AM ET","Sun Oct 18 · 1:00 PM ET","Sun Oct 18 · 1:00 PM ET","Sun Oct 18 · 1:00 PM ET","Sun Oct 18 · 1:00 PM ET","Sun Oct 18 · 1:00 PM ET","Sun Oct 18 · 1:00 PM ET","Sun Oct 18 · 1:00 PM ET","Sun Oct 18 · 4:05 PM ET","Sun Oct 18 · 4:25 PM ET","Sun Oct 18 · 4:25 PM ET","Sun Oct 18 · 8:20 PM ET","Mon Oct 19 · 8:15 PM ET"];
const i=Math.max(0,Math.min(games.length-1,parseInt(new URLSearchParams(location.search).get("game"),10)||0)),g=games[i];
const $=id=>document.getElementById(id);$("weekGame").textContent="WEEK 6 · GAME "+(i+1);$("matchup").textContent=g[0]+" @ "+g[1];$("kickoff").textContent=times[i];$("awayTeam").textContent=g[0];$("homeTeam").textContent=g[1];
async function loadRows(){try{const response=await fetch("./data/week-06-picks.json",{cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();return (data.entries||[]).filter(x=>Array.isArray(x.picks)&&x.picks.length===games.length)}catch(e){console.warn("Shared Week 6 picks unavailable",e);return (localStorage.getItem("nflw6entries")||"").split(/\\n+/).map(x=>x.trim()).filter(Boolean).map(x=>{const [name,picks]=x.split("|");return{name,picks:(picks||"").split(",").map(p=>p.trim().toUpperCase())}}).filter(x=>x.picks.length===games.length)}}
async function renderPicks(){const rows=await loadRows();
const away=rows.filter(r=>r.picks[i]===g[0]),home=rows.filter(r=>r.picks[i]===g[1]),total=away.length+home.length,pct=n=>total?(100*n/total).toFixed(1):"0.0";
$("balanceTitle").textContent="LEAGUE PICK BALANCE · "+total+" PLAYERS";$("awaySummary").textContent=g[0]+" "+pct(away.length)+"% ("+away.length+")";$("homeSummary").textContent=g[1]+" "+pct(home.length)+"% ("+home.length+")";$("fill").style.width=pct(away.length)+"%";$("awayCount").textContent=away.length+" picks · "+pct(away.length)+"%";$("homeCount").textContent=home.length+" picks · "+pct(home.length)+"%";
for(const [id,list] of [["awayNames",away],["homeNames",home]]){const el=$(id);if(!total){el.innerHTML='<div class="pending">Week 6 player selections have not been loaded yet.</div>'}else if(!list.length){el.innerHTML='<div class="pending">No picks for this team.</div>'}else{list.sort((a,b)=>a.name.localeCompare(b.name));for(const r of list){const div=document.createElement("div");div.className="name";div.textContent=r.name;el.appendChild(div)}}}
}
renderPicks();
</script></body></html>
